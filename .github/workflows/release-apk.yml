# 推送 v* 标签后构建 APK，并发布到当前仓库的 GitHub Releases。
# 日常发布用 scripts/release.ps1：它会带上说明并推送 annotated tag。
#
# 一次性配置：仓库 Settings → Secrets → Actions
#   UPLOAD_KEYSTORE_BASE64
#   UPLOAD_STORE_PASSWORD
#   UPLOAD_KEY_ALIAS
# 见仓库根目录 keystore.properties.example

name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已有标签，例如 v0.1.0"
        required: true
        type: string
      notes:
        description: "Release 说明。留空则使用标签上的说明"
        required: false
        type: string

concurrency:
  group: release-apk-${{ github.ref_name || github.event.inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      APK_PATH: app/build/outputs/apk/debug/UESTC-NightSign.apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${TAG#"${TAG%%[![:space:]]*}"}"
          TAG="${TAG%"${TAG##*[![:space:]]}"}"
          if [ -z "$TAG" ]; then
            echo "::error::Release tag is empty"
            exit 1
          fi
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag must look like v0.1.0, got: $TAG"
            exit 1
          fi
          VERSION="${TAG#v}"
          GRADLE_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          GRADLE_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          if [ "$VERSION" != "$GRADLE_NAME" ]; then
            echo "::error::Tag $TAG does not match versionName $GRADLE_NAME in app/build.gradle.kts"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$GRADLE_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Runner has no Android SDK"
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platforms;android-36"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Configure UPLOAD_KEYSTORE_BASE64, UPLOAD_STORE_PASSWORD and UPLOAD_KEY_ALIAS"
            exit 1
          fi
          mkdir -p signing
          STORE_PASSWORD="$(printf '%s' "$STORE_PASSWORD" | tr -d '\r\n')"
          ALIAS="$(printf '%s' "${KEY_ALIAS:-upload}" | tr -d '\r\n')"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > signing/upload.jks
          if [ ! -s signing/upload.jks ]; then
            echo "::error::upload.jks is empty after base64 decode"
            exit 1
          fi
          if ! "${JAVA_HOME}/bin/keytool" -list -keystore signing/upload.jks -storepass "$STORE_PASSWORD" -alias "$ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore password or alias does not match"
            exit 1
          fi
          {
            echo "storeFile=signing/upload.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${ALIAS}"
            echo "keyPassword=${STORE_PASSWORD}"
          } > keystore.properties

      - name: Build debug APK
        run: bash ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        run: |
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found at $APK_PATH"
            find app/build/outputs/apk -name '*.apk' -ls || true
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Write release notes file
        env:
          INPUT_NOTES: ${{ github.event.inputs.notes }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          {
            if [ -n "$INPUT_NOTES" ]; then
              printf '%s\n\n' "$INPUT_NOTES"
            else
              git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
              git for-each-ref "refs/tags/${TAG}" --format='%(contents)'
              echo ""
            fi
            echo "versionName ${{ steps.meta.outputs.version }}"
            echo "versionCode ${{ steps.meta.outputs.version_code }}"
            echo ""
            echo "下载 UESTC-NightSign.apk 后安装。"
          } > release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: 晚安成电 ${{ steps.meta.outputs.tag }}
          files: ${{ env.APK_PATH }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
